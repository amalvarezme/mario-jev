[project]
name = "mario-jev"
version = "0.1.0"
description = "Real-time Super Mario Bros. (NES) agent driven by the Jev System One decision model"
requires-python = ">=3.14"
dependencies = [
    "gym-super-mario-bros==9.1.0",
    "nes-py==9.0.1",
    "numpy>=2.0",
    "pillow>=11",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The PlayJev advisor is optional on purpose: it must never sit on the critical path.
advisor = ["torch>=2.9", "transformers>=4.57"]

[project.scripts]
mario-jev = "mario_jev.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]
markers = [
    "live_jev: requires JEV_API_KEY and makes a real network call to the Jev API",
    "playjev: requires the optional torch/transformers stack and the PlayJev weights",
    "slow: takes more than a couple of seconds",
]
